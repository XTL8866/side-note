<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侧边便签 · 交互原型 v4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #e3e9f2 45%, #dfe6f0 100%);
    color: #1f2937; -webkit-font-smoothing: antialiased;
  }

  .desktop { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .desktop-hint { text-align: center; color: #94a3b8; font-size: 13px; line-height: 2; pointer-events: none; max-width: 420px; }
  .desktop-hint strong { color: #64748b; font-weight: 500; }
  .desktop-hint .kbd {
    display: inline-block; padding: 2px 7px; border-radius: 5px; background: #fff;
    border: 1px solid #d8dee9; box-shadow: 0 1px 0 #d8dee9; font-size: 12px; color: #475569;
  }

  /* =========================================================
     侧边条容器：四方向停靠 + 自由摆放
     ========================================================= */
  #dock {
    position: fixed; display: flex; z-index: 100;
    transition: width .2s cubic-bezier(.4,0,.2,1), height .16s ease, left .16s ease, top .16s ease;
  }
  #dock.dragging { transition: none !important; }

  /* 排布方向：v = 竖排标签（卡片在右），h = 横排标签（卡片在下） */
  #dock[data-orient="v"] { width: 152px; }
  #dock[data-orient="v"].is-open { width: 446px; }

  #dock[data-pos="left"]   { left: 0; top: 50%; transform: translateY(-50%); flex-direction: row; }
  #dock[data-pos="right"]  { right: 0; top: 50%; transform: translateY(-50%); flex-direction: row-reverse; }
  #dock[data-pos="top"]    { left: 50%; top: 0; transform: translateX(-50%); flex-direction: column; align-items: center; }
  #dock[data-pos="bottom"] { left: 50%; bottom: 0; transform: translateX(-50%); flex-direction: column-reverse; align-items: center; }
  #dock[data-pos="free"]   { transform: none; flex-direction: row; }
  #dock[data-pos="free"][data-orient="h"] { flex-direction: column; align-items: center; }

  /* ============ 标签栏 ============ */
  .rail { flex: 0 0 152px; width: 152px; display: flex; flex-direction: column; gap: 8px; padding: 6px 0; }

  #dock[data-orient="h"] .rail {
    flex: 0 0 auto; width: auto; height: 56px;
    flex-direction: row; align-items: center; gap: 8px; padding: 0 10px;
  }

  .tab {
    display: flex; align-items: center; gap: 7px;
    width: 146px; height: 38px; padding: 0 11px; flex: 0 0 38px;
    border: 0; border-radius: 9px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: 500; text-align: left;
    white-space: nowrap; overflow: hidden;
    box-shadow: 0 1px 2px rgba(15,23,42,.13), 0 0 0 .5px rgba(15,23,42,.05);
    transition: transform .16s cubic-bezier(.22,.61,.36,1), box-shadow .16s, width .16s;
  }
  .tab:hover { transform: translateX(3px); width: 149px; box-shadow: 0 3px 10px rgba(15,23,42,.16), 0 0 0 .5px rgba(15,23,42,.06); }
  #dock[data-orient="h"] .tab { width: auto; min-width: 84px; flex: 0 0 auto; }
  #dock[data-orient="h"] .tab:hover { width: auto; transform: none; }

  .tab .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; opacity: .65; }
  .tab .tname { overflow: hidden; text-overflow: ellipsis; }
  .tab .num { margin-left: auto; font-size: 11px; font-weight: 400; opacity: .6; padding-left: 6px; }
  .tab.active { box-shadow: 0 2px 8px rgba(15,23,42,.18), 0 0 0 1.5px rgba(255,255,255,.8); }

  .rail-actions { display: flex; gap: 6px; width: 146px; }
  .rail-add, .rail-gear, .rail-grip {
    height: 34px; border-radius: 9px;
    border: 1px dashed rgba(100,116,139,.36);
    background: rgba(255,255,255,.6); color: #64748b;
    font-size: 16px; line-height: 1; cursor: pointer;
    box-shadow: 0 1px 2px rgba(15,23,42,.06);
    transition: background .15s, color .15s;
  }
  .rail-add:hover, .rail-gear:hover, .rail-grip:hover { background: #fff; color: #1e293b; }
  .rail-add { flex: 1; }
  .rail-gear, .rail-grip { flex: 0 0 36px; font-size: 13px; border-style: solid; border-color: rgba(100,116,139,.2); }
  .rail-grip { cursor: grab; font-size: 15px; letter-spacing: -1px; }
  .rail-grip:active { cursor: grabbing; }

  #dock[data-orient="h"] .rail-actions { width: auto; }
  #dock[data-orient="h"] .rail-add { flex: 0 0 44px; }
  #dock[data-orient="h"] .rail-gear,
  #dock[data-orient="h"] .rail-grip { flex: 0 0 40px; }
  #dock[data-orient="h"] .rail-add,
  #dock[data-orient="h"] .rail-gear,
  #dock[data-orient="h"] .rail-grip { height: 38px; }

  /* ============ 清单卡片 ============ */
  .panel {
    flex: 0 0 282px; width: 282px; height: 556px; margin-left: 12px;
    background: #fcfcfd; border-radius: 14px;
    box-shadow: 0 10px 38px rgba(15,23,42,.17), 0 0 0 .5px rgba(15,23,42,.06);
    display: flex; flex-direction: column; overflow: hidden;
    opacity: 0; transform: translateX(-10px) scale(.985);
    transition: opacity .14s ease, transform .18s cubic-bezier(.4,0,.2,1);
  }
  #dock.is-open .panel { opacity: 1; transform: none; transition-delay: .04s; }

  #dock[data-orient="h"] .panel {
    flex: 0 0 auto; width: 302px; height: min(556px, calc(100vh - 130px));
    margin-left: 0; opacity: 1; transform: none;
  }
  #dock[data-pos="top"] .panel { margin-top: 10px; }
  #dock[data-pos="bottom"] .panel { margin-bottom: 10px; }
  #dock[data-pos="free"][data-orient="h"] .panel { margin-top: 10px; }
  #dock[data-orient="h"]:not(.is-open) .panel { display: none; }

  @keyframes dropIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  #dock.is-open[data-orient="h"] .panel { animation: dropIn .16s ease; }
  #dock.is-open[data-pos="bottom"] .panel { animation: riseIn .16s ease; }

  .panel-head { padding: 15px 16px 9px; display: flex; align-items: flex-start; gap: 8px; flex: 0 0 auto; }
  .panel-title { font-size: 14.5px; font-weight: 500; }
  .panel-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; }
  .pin {
    margin-left: auto; flex: 0 0 24px; width: 24px; height: 24px; border-radius: 7px;
    border: 1px solid transparent; background: transparent; cursor: pointer;
    font-size: 12px; line-height: 1; display: grid; place-items: center;
    color: #b6c0cd; transition: all .15s;
  }
  .pin:hover { background: #f1f5f9; color: #475569; }
  .pin.on { background: #e8f0fe; border-color: #c7daf9; color: #1567d3; }

  .list { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }
  .list::-webkit-scrollbar, .settings::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb, .settings::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }
  .empty { padding: 30px 10px; text-align: center; color: #b6c0cd; font-size: 12.5px; }

  .item { display: flex; gap: 9px; padding: 8px; border-radius: 9px; cursor: pointer; transition: background .13s; align-items: flex-start; }
  .item:hover { background: #f1f5f9; }
  .box {
    width: 15px; height: 15px; flex: 0 0 15px; margin-top: 1px; border-radius: 4px;
    border: 1.5px solid #cbd5e1; display: grid; place-items: center;
    font-size: 10px; color: #fff; transition: all .15s;
  }
  .item.done .box { background: #22c55e; border-color: #22c55e; }
  .item.done .ititle { color: #b6c0cd; text-decoration: line-through; }
  .ititle { font-size: 13px; line-height: 1.45; word-break: break-word; }
  .imeta { display: flex; gap: 6px; margin-top: 4px; align-items: center; flex-wrap: wrap; }
  .chip { font-size: 10.5px; padding: 1px 6px; border-radius: 5px; background: #eef2f7; color: #64748b; }
  .chip.today { background: #dbeafe; color: #1d4ed8; }
  .chip.overdue { background: #fee2e2; color: #b91c1c; }
  .btn-mini {
    height: 24px; padding: 0 9px; border-radius: 7px; border: 1px solid #e2e8f0;
    background: #fff; font-family: inherit; font-size: 11.5px; color: #64748b;
    cursor: pointer; transition: all .14s;
  }
  .btn-mini:hover { border-color: #93b4f5; color: #1567d3; background: #f8fbff; }
  .pri { width: 5px; height: 5px; border-radius: 50%; background: #f59e0b; }
  .pri.p1 { background: #ef4444; }
  .pri.p3 { background: #cbd5e1; }

  .panel-foot { border-top: 1px solid #eef2f7; padding: 9px 12px 11px; flex: 0 0 auto; }
  .add-input {
    width: 100%; height: 33px; border-radius: 9px; border: 1px solid #e2e8f0;
    padding: 0 10px; font-size: 12.5px; font-family: inherit; color: #1f2937;
    background: #fff; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .add-input:focus { border-color: #93b4f5; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
  .add-input::placeholder { color: #b6c0cd; }
  .foot-tip { font-size: 10.5px; color: #b6c0cd; margin-top: 5px; padding-left: 2px; }

  /* ============ 设置页 ============ */
  .settings { flex: 1; overflow-y: auto; padding: 2px 14px 12px; display: none; }
  .settings.on { display: block; }
  .set-group { padding: 7px 0; border-bottom: 1px solid #f1f5f9; }
  .set-group:last-of-type { border-bottom: 0; }
  .set-row { display: flex; align-items: center; gap: 10px; }
  .set-row + .set-row { margin-top: 10px; }
  .set-label { font-size: 12.5px; font-weight: 500; }
  .set-desc { font-size: 10.5px; color: #94a3b8; margin-top: 2px; }
  .set-right { margin-left: auto; flex: 0 0 auto; }

  .switch {
    width: 36px; height: 20px; border-radius: 10px; border: 0; padding: 0;
    background: #dfe5ec; cursor: pointer; position: relative; transition: background .18s;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(15,23,42,.2);
    transition: transform .18s cubic-bezier(.4,0,.2,1);
  }
  .switch.on { background: #1567d3; }
  .switch.on::after { transform: translateX(16px); }

  .pos-group { display: flex; gap: 4px; }
  .pos-btn {
    width: 30px; height: 26px; border-radius: 7px; border: 1px solid #e2e8f0;
    background: #fff; font-family: inherit; font-size: 12px; color: #64748b;
    cursor: pointer; transition: all .14s;
  }
  .pos-btn:hover { border-color: #c7daf9; color: #1567d3; }
  .pos-btn.on { background: #1567d3; border-color: #1567d3; color: #fff; }

  .range { width: 100%; margin-top: 8px; accent-color: #1567d3; }

  .tag-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  .tag-color {
    width: 22px; height: 22px; flex: 0 0 22px; padding: 0; border: 0; border-radius: 6px;
    background: none; cursor: pointer; overflow: hidden;
  }
  .tag-color::-webkit-color-swatch-wrapper { padding: 0; }
  .tag-color::-webkit-color-swatch { border: 1px solid rgba(15,23,42,.12); border-radius: 6px; }
  .tag-name {
    flex: 1; min-width: 0; height: 25px; border-radius: 7px; border: 1px solid #e8edf4;
    padding: 0 7px; font-family: inherit; font-size: 12px; color: #1f2937; background: #fff; outline: none;
  }
  .tag-name:focus { border-color: #93b4f5; box-shadow: 0 0 0 2.5px rgba(59,130,246,.1); }
  .tag-del {
    flex: 0 0 22px; width: 22px; height: 22px; border: 0; border-radius: 6px;
    background: transparent; color: #cbd5e1; font-size: 13px; cursor: pointer; line-height: 1;
  }
  .tag-del:hover { background: #fee2e2; color: #dc2626; }
  .tag-del[disabled] { opacity: .3; cursor: not-allowed; }
  .tag-del[disabled]:hover { background: transparent; color: #cbd5e1; }

  .btn-add-tag {
    width: 100%; height: 28px; margin-top: 6px; border-radius: 8px;
    border: 1px dashed #cbd5e1; background: #fff; color: #64748b;
    font-family: inherit; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .btn-add-tag:hover { border-color: #93b4f5; color: #1567d3; background: #f8fbff; }
  .set-note { font-size: 10px; color: #b6c0cd; line-height: 1.6; padding-top: 8px; }

  /* 提醒 */
  .toast-layer { position: fixed; top: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    width: 320px; background: #fff; border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 12px 34px rgba(15,23,42,.16), 0 0 0 .5px rgba(15,23,42,.06);
    animation: pop .28s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes pop { from { opacity: 0; transform: translateX(18px) scale(.97); } to { opacity: 1; transform: none; } }
  .toast-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #b45309; font-weight: 500; }
  .toast-title { font-size: 14px; font-weight: 500; margin: 7px 0 2px; line-height: 1.5; }
  .toast-time { font-size: 11.5px; color: #94a3b8; }
  .toast-btns { display: flex; gap: 7px; margin-top: 12px; }
  .tbtn {
    flex: 1; height: 30px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff;
    font-family: inherit; font-size: 12px; color: #475569; cursor: pointer; transition: all .13s;
  }
  .tbtn:hover { background: #f8fafc; border-color: #cbd5e1; }
  .tbtn.primary { background: #1567d3; border-color: #1567d3; color: #fff; }
  .tbtn.primary:hover { background: #1058b8; }

  .fab { position: fixed; right: 24px; bottom: 24px; z-index: 150; display: flex; gap: 8px; }
  .fab button {
    height: 32px; padding: 0 13px; border-radius: 16px; border: 1px solid #dbe2ec;
    background: rgba(255,255,255,.9); font-family: inherit; font-size: 12px;
    color: #475569; cursor: pointer; backdrop-filter: blur(6px); transition: all .14s;
  }
  .fab button:hover { background: #fff; box-shadow: 0 4px 14px rgba(15,23,42,.08); color: #1e293b; }

  /* ===== 尺寸缩放：--s 由设置里的「大小」滑杆控制 ===== */
  #dock { --s: 1; }
  #dock[data-orient="v"] { width: calc(152px * var(--s)); }
  #dock[data-orient="v"].is-open { width: calc(446px * var(--s)); }
  .rail { flex-basis: calc(152px * var(--s)); width: calc(152px * var(--s)); gap: calc(8px * var(--s)); }
  .tab {
    width: calc(146px * var(--s)); height: calc(38px * var(--s));
    flex-basis: calc(38px * var(--s)); font-size: calc(13px * var(--s)); padding: 0 calc(11px * var(--s));
  }
  .tab:hover { width: calc(149px * var(--s)); }
  .rail-actions { width: calc(146px * var(--s)); }
  .rail-add, .rail-gear, .rail-grip { height: calc(34px * var(--s)); }
  .rail-gear, .rail-grip { flex-basis: calc(36px * var(--s)); }
  .panel {
    flex-basis: calc(282px * var(--s)); width: calc(282px * var(--s));
    height: min(calc(600px * var(--s)), calc(100vh - 40px));
    margin-left: calc(12px * var(--s));
  }
  #dock[data-orient="h"] .rail { height: calc(56px * var(--s)); gap: calc(8px * var(--s)); }
  #dock[data-orient="h"] .tab { min-width: calc(84px * var(--s)); }
  #dock[data-orient="h"] .rail-add { flex-basis: calc(44px * var(--s)); }
  #dock[data-orient="h"] .rail-gear,
  #dock[data-orient="h"] .rail-grip { flex-basis: calc(40px * var(--s)); }
  #dock[data-orient="h"] .rail-add,
  #dock[data-orient="h"] .rail-gear,
  #dock[data-orient="h"] .rail-grip { height: calc(38px * var(--s)); }
  #dock[data-orient="h"] .panel {
    width: calc(302px * var(--s));
    height: min(calc(600px * var(--s)), calc(100vh - 130px));
  }
  .panel-title { font-size: calc(14.5px * var(--s)); }
  .ititle { font-size: calc(13px * var(--s)); }
  .add-input { height: calc(33px * var(--s)); font-size: calc(12.5px * var(--s)); }
</style>
</head>
<body>

<div class="desktop">
  <div class="desktop-hint">
    <p>鼠标在彩签上<strong>停约 0.4 秒</strong>清单才滑出来</p>
    <p style="margin-top:6px">齿轮改设置与标签 · 拖动 <strong>⠿</strong> 可把整条摆到任意位置（靠边自动吸附）</p>
  </div>
</div>

<div id="dock" data-pos="left" data-orient="v">
  <div class="rail" id="rail"></div>

  <div class="panel">
    <div class="panel-head">
      <div>
        <div class="panel-title" id="panelTitle">今日</div>
        <div class="panel-sub" id="panelSub"></div>
      </div>
      <button class="pin" id="pinBtn" title="固定展开">📌</button>
    </div>

    <div class="list" id="list"></div>

    <div class="settings" id="settingsView">
      <div class="set-group">
        <div class="set-row">
          <div>
            <div class="set-label">停靠位置</div>
            <div class="set-desc">拖 ⠿ 可自由摆放</div>
          </div>
          <div class="set-right pos-group" id="posGroup">
            <button class="pos-btn" data-pos="left">左</button>
            <button class="pos-btn" data-pos="top">上</button>
            <button class="pos-btn" data-pos="right">右</button>
            <button class="pos-btn" data-pos="bottom">下</button>
          </div>
        </div>
        <div class="set-row">
          <div>
            <div class="set-label">置顶显示</div>
            <div class="set-desc">压在其它窗口上方</div>
          </div>
          <div class="set-right"><button class="switch" id="swTop"></button></div>
        </div>
        <div class="set-row">
          <div>
            <div class="set-label">全屏时让位</div>
            <div class="set-desc">有窗口全屏就自动躲起来</div>
          </div>
          <div class="set-right"><button class="switch" id="swFull"></button></div>
        </div>
        <div class="set-row">
          <div>
            <div class="set-label">被挡住时让位</div>
            <div class="set-desc">有窗口压住它就收起来，鼠标贴边再出来</div>
          </div>
          <div class="set-right"><button class="switch" id="swOcc"></button></div>
        </div>
        <div class="set-row">
          <div>
            <div class="set-label">开机自启</div>
            <div class="set-desc">登录 Windows 后自动运行</div>
          </div>
          <div class="set-right"><button class="switch" id="swStart"></button></div>
        </div>
        <div class="set-row">
          <div>
            <div class="set-label">到点提醒</div>
            <div class="set-desc">时间到了自动弹通知</div>
          </div>
          <div class="set-right" style="display:flex;align-items:center;gap:8px">
            <button class="btn-mini" id="remindTry">试一下</button>
            <button class="switch" id="swRemind"></button>
          </div>
        </div>
      </div>

      <div class="set-group">
        <div class="set-row">
          <div>
            <div class="set-label">展开停留</div>
            <div class="set-desc">鼠标按住标签多久才展开</div>
          </div>
          <div class="set-right" style="font-size:11.5px;color:#1567d3;font-weight:500" id="delayVal">400ms</div>
        </div>
        <input type="range" class="range" id="delayRange" min="200" max="800" step="50" value="400">
        <div class="set-row" style="margin-top:12px">
          <div>
            <div class="set-label">大小</div>
            <div class="set-desc">标签和卡片一起缩放</div>
          </div>
          <div class="set-right" style="font-size:11.5px;color:#1567d3;font-weight:500" id="scaleVal">100%</div>
        </div>
        <input type="range" class="range" id="scaleRange" min="80" max="130" step="5" value="100">
      </div>

      <div class="set-group">
        <div class="set-label">我的标签</div>
        <div id="tagEditor"></div>
        <button class="btn-add-tag" id="addTag">＋ 新建标签</button>
      </div>

      <div class="set-note">置顶 / 开机自启 需打包成 exe 后才真正生效</div>
    </div>

    <div class="panel-foot" id="panelFoot">
      <input class="add-input" id="addInput" placeholder="明天下午3点 交周报 ※ 回车添加">
      <div class="foot-tip">支持：今天 / 明天 / 后天 / 周三 / 下午3点</div>
    </div>
  </div>
</div>

<div class="toast-layer" id="toastLayer"></div>

<div class="fab">
  <button id="demoBtn">模拟到点提醒</button>
  <button id="resetBtn">重置全部</button>
</div>

<script>
const STORE_KEY = 'dock_todo_v4';
const REMIND_WINDOW = 12 * 3600 * 1000;   // 错过超过 12 小时就不再补提醒，免得一开机炸一堆
const PALETTE = ['#bee3fa', '#c5e8a8', '#fbe7a1', '#f9bbd0', '#d9d5f5', '#ffd9b8', '#b8e2e0', '#e6dcf7'];

const DEFAULT_TAGS = [

let tags = [], tasks = [], settings = {}, currentTagId = 't1', screen = 'list';

/* ========== 持久化 ========== */
function load() {
  let firstRun = false;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) throw 0;
    const d = JSON.parse(raw);
    tags = d.tags && d.tags.length ? d.tags : structuredClone(DEFAULT_TAGS);
    tasks = d.tasks || structuredClone(DEFAULT_TASKS);
    settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
    currentTagId = d.currentTagId || tags[0].id;
  } catch (e) {
    tags = structuredClone(DEFAULT_TAGS);
    tasks = structuredClone(DEFAULT_TASKS);
    settings = Object.assign({}, DEFAULT_SETTINGS);
    currentTagId = 't1';
    firstRun = true;
  }
  if (!tags.find(t => t.id === currentTagId)) currentTagId = tags[0].id;
  // 旧版本里「置顶」开关只是摆设（窗口一直硬编码置顶），迁移时按真实行为纠正一次
  if (!settings.__topFixed) { settings.alwaysOnTop = true; settings.__topFixed = 1; }
  migrateTasks();
  // 首次打开自带的示例事项不该弹通知打扰你
  if (firstRun) { tasks.forEach(t => { t.reminded = true; }); save(); }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ tags, tasks, settings, currentTagId })); } catch (e) {}
}

function textOn(hex) {
  const h = hex.replace('#', '');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return ((0.299 * r + 0.587 * g + 0.114 * b) / 255) > 0.62 ? '#1f2937' : '#ffffff';
}

/* ========== 时间：解析 / 格式化 ========== */
const DAY_MS = 86400000;
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }

/* 把「明天下午3点」「周三 9:30」「10-25」解析成绝对时间 */
function parseDate(text, nowMs) {
  const now = new Date(nowMs || Date.now());
  const s = String(text || '');
  let day = null, explicitDay = false, dayOnly = true, hasTime = false;

  const dayMap = { '今天': 0, '今日': 0, '明天': 1, '明日': 1, '明早': 1, '明晚': 1, '后天': 2 };
  for (const k in dayMap) {
    if (s.includes(k)) {
      day = startOfDay(new Date(now.getTime() + dayMap[k] * DAY_MS));
      explicitDay = true;
      break;
    }
  }
  if (!day) {
    const wm = s.match(/(?:周|星期)([一二三四五六日天])/);
    if (wm) {
      const map = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 0, '天': 0 };
      let add = (map[wm[1]] - now.getDay() + 7) % 7;
      if (add === 0) add = 7;                       // 说到本周的同一天 → 理解为下周
      day = startOfDay(new Date(now.getTime() + add * DAY_MS));
      explicitDay = true;
    }
  }
  if (!day) {
    const dm = s.match(/(\d{1,2})\s*[-月/]\s*(\d{1,2})/);
    if (dm) {
      const y = now.getFullYear();
      const cand = new Date(y, parseInt(dm[1], 10) - 1, parseInt(dm[2], 10));
      if (cand.getTime() < startOfDay(now).getTime()) cand.setFullYear(y + 1);
      day = cand;
      explicitDay = true;
    }
  }

  // 「今晚8点」里的「今晚」也要能当时间前缀，否则 8 点会被当成早上 8 点
  const tm = s.match(/(凌晨|上午|中午|下午|傍晚|晚上|今晚|早上)?\s*(\d{1,2})\s*[:：点]\s*(\d{0,2})/);
  let h = 9, mi = 0;
  if (tm) {
    h = parseInt(tm[2], 10);
    mi = tm[3] ? parseInt(tm[3], 10) : 0;
    if (h > 23) h = 23;
    if (mi > 59) mi = 59;
    // 「明晚 8点」的「明晚」被当成日期拿走了，所以 PM 线索还要看整句
    const pm = /下午|晚上|傍晚|今晚|夜里/.test(tm[1] || '') || /明晚|今晚|夜里/.test(s);
    const am = /凌晨|上午|早上/.test(tm[1] || '') || /明早|今早|凌晨/.test(s);
    if (pm && h < 12) h += 12;
    if (/中午/.test(tm[1] || '') && h < 11) h += 12;
    if (am && h === 12) h = 0;
    hasTime = true;
    dayOnly = false;
  }

  // 完全没有日期线索 → 不设提醒
  if (!explicitDay && !hasTime) return null;

  if (!day) day = startOfDay(now);
  const out = new Date(day);
  out.setHours(h, mi, 0, 0);

  // 没说哪天、但时间已经过了 → 顺延到明天
  if (!explicitDay && hasTime && out.getTime() < now.getTime() - 60000) out.setDate(out.getDate() + 1);

  return { dueAt: out.getTime(), dayOnly };
}

/* 绝对时间 → 列表里显示的短标签；用没用「周三」这种说法决定要不要显示星期 */
function fmtDue(ts, dayOnly, weekday) {
  if (!ts) return '稍后';
  const d = new Date(ts);
  const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / DAY_MS);
  let day;
  if (diff === 0) day = '今天';
  else if (diff === -1) day = '昨天';
  else if (weekday && diff > 0) day = WD[d.getDay()];       // 用户写的是「周三」就还他「周三」
  else if (diff === 1) day = '明天';
  else if (diff === 2) day = '后天';
  else day = (d.getMonth() + 1) + '-' + d.getDate();
  if (dayOnly) return day;
  return day + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

/* 老数据迁移：把只有文字的任务补上绝对时间 */
function migrateTasks() {
  const now = Date.now();
  let dirty = false;
  tasks.forEach(t => {
    if (typeof t.reminded !== 'boolean') { t.reminded = false; dirty = true; }
    if (t.dueAt === null) return;                        // 已经确认无时间
    if (typeof t.dueAt === 'number' && t.dueAt > 0) return;
    const r = parseDate(t.due, now);
    if (!r) { t.dueAt = null; t.dayOnly = true; dirty = true; return; }
    t.dueAt = r.dueAt;
    t.dayOnly = r.dayOnly;
    dirty = true;
    if (t.dayOnly && t.dueAt < now) { t.dueAt = null; return; }   // 只写了「今天」又已过期 → 不再提醒
    if (t.dueAt < now - REMIND_WINDOW) t.reminded = true;         // 错过太久的静默掉，别开机炸一堆
    t.due = fmtDue(t.dueAt, t.dayOnly, /周|星期/.test(t.due || ''));
  });
  if (dirty) save();
}

let idSeq = 0;
function nextId() { return Date.now() * 100 + (idSeq++ % 100); }

const rail = document.getElementById('rail');
const dock = document.getElementById('dock');
const pinBtn = document.getElementById('pinBtn');

/* ========== 位置 ========== */
function applyScale() {
  dock.style.setProperty('--s', String(settings.scale || 1));
  const el = document.getElementById('scaleVal');
  if (el) el.textContent = Math.round((settings.scale || 1) * 100) + '%';
  const rg = document.getElementById('scaleRange');
  if (rg) rg.value = Math.round((settings.scale || 1) * 100);
}

function applyPos() {
  const p = settings.pos || 'left';
  dock.dataset.pos = p;
  dock.dataset.orient = (p === 'top' || p === 'bottom')
    ? 'h'
    : (p === 'free' ? (settings.orient || 'v') : 'v');
  if (p === 'free') {
    dock.style.left = (settings.freeX || 80) + 'px';
    dock.style.top = (settings.freeY || 200) + 'px';
    dock.style.right = 'auto';
    dock.style.bottom = 'auto';
    dock.style.transform = 'none';
  } else {
    dock.style.left = ''; dock.style.top = '';
    dock.style.right = ''; dock.style.bottom = '';
    dock.style.transform = '';
  }
}
function setPos(p, freeX, freeY) {
  settings.pos = p;
  if (p === 'top' || p === 'bottom') settings.orient = 'h';
  else if (p === 'left' || p === 'right') settings.orient = 'v';
  if (p === 'free') { settings.freeX = Math.round(freeX); settings.freeY = Math.round(freeY); }
  save();
  applyPos();
  renderSettings();
}

/* ========== 渲染：标签栏 ========== */
function renderRail() {
  rail.innerHTML = tags.map(t => {
    const fg = textOn(t.color);
    return `<button class="tab ${t.id === currentTagId && screen === 'list' ? 'active' : ''}" data-tag="${t.id}"
      style="background:${t.color};color:${fg}">
      <span class="dot" style="background:${fg}"></span>
      <span class="tname">${escapeHtml(t.name)}</span>
      <span class="num" data-count="${t.id}"></span>
    </button>`;
  }).join('') + `<div class="rail-actions">
      <button class="rail-add" id="railAdd" title="新建">+</button>
      <button class="rail-grip" id="railGrip" title="拖动摆放">⠿</button>
      <button class="rail-gear" id="railGear" title="设置">⚙</button>
    </div>`;

  rail.querySelectorAll('.tab').forEach(el => {
    el.addEventListener('click', () => {
      currentTagId = el.dataset.tag;
      screen = 'list';
      render();
      openPanel();
    });
  });
  rail.querySelector('#railAdd').addEventListener('click', () => {
    screen = 'list'; render(); openPanel();
    setTimeout(() => document.getElementById('addInput').focus(), 300);
  });
  rail.querySelector('#railGear').addEventListener('click', () => {
    screen = screen === 'settings' ? 'list' : 'settings';
    render(); openPanel();
  });
  rail.querySelector('#railGrip').addEventListener('pointerdown', startDrag);
}

/* ========== 拖拽 ========== */
let drag = null;
function startDrag(e) {
  e.preventDefault();
  e.stopPropagation();
  const r = dock.getBoundingClientRect();
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height };
  dock.classList.add('dragging');
  if (isOpen) { isOpen = false; dock.classList.remove('is-open'); }
  e.currentTarget.setPointerCapture(e.pointerId);
}
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const x = Math.min(Math.max(0, e.clientX - drag.dx), Math.max(0, innerWidth - drag.w));
  const y = Math.min(Math.max(0, e.clientY - drag.dy), Math.max(0, innerHeight - drag.h));
  drag.lastX = x; drag.lastY = y;
  dock.dataset.pos = 'free';
  dock.style.left = x + 'px'; dock.style.top = y + 'px';
  dock.style.right = 'auto'; dock.style.bottom = 'auto'; dock.style.transform = 'none';
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  dock.classList.remove('dragging');
  const r = dock.getBoundingClientRect();
  const SNAP = 30;
  const x = drag.lastX != null ? drag.lastX : r.left;
  const y = drag.lastY != null ? drag.lastY : r.top;
  drag = null;
  if (x < SNAP) setPos('left');
  else if (innerWidth - (x + r.width) < SNAP) setPos('right');
  else if (y < SNAP) setPos('top');
  else if (innerHeight - (y + r.height) < SNAP) setPos('bottom');
  else setPos('free', x, y);
});

/* ========== 渲染：清单 / 设置 ========== */
function render() {
  renderRail();
  const listEl = document.getElementById('list');
  const setEl = document.getElementById('settingsView');
  const footEl = document.getElementById('panelFoot');
  const titleEl = document.getElementById('panelTitle');
  const subEl = document.getElementById('panelSub');

  if (screen === 'settings') {
    titleEl.textContent = '设置';
    subEl.textContent = '位置、标签、启动项';
    listEl.style.display = 'none';
    footEl.style.display = 'none';
    setEl.classList.add('on');
    renderSettings();
    return;
  }

  setEl.classList.remove('on');
  listEl.style.display = '';
  footEl.style.display = '';

  const tag = tags.find(t => t.id === currentTagId) || tags[0];
  titleEl.textContent = tag.name;
  subEl.textContent = tag.system ? '所有已完成的事项' : `${countOf(tag.id)} 项未完成`;

  const items = tag.system
    ? tasks.filter(t => t.done)
    : tasks.filter(t => t.tagId === tag.id && !t.done);

  listEl.innerHTML = items.length
    ? items.map(t => {
      const late = !t.done && t.dueAt && t.dueAt < Date.now();
      const cls = late ? 'chip overdue' : (/今天|明天/.test(t.due) ? 'chip today' : 'chip');
      return `
      <div class="item ${t.done ? 'done' : ''}" data-id="${t.id}">
        <span class="box">${t.done ? '✓' : ''}</span>
        <div style="flex:1;min-width:0">
          <div class="ititle">${escapeHtml(t.title)}</div>
          <div class="imeta">
            <span class="${cls}">${escapeHtml(t.due || '稍后')}</span>
            <span class="pri p${t.pri}"></span>
          </div>
        </div>
      </div>`;
    }).join('')
    : '<div class="empty">这里空着，挺好</div>';

  listEl.querySelectorAll('.item').forEach(el => {
    el.addEventListener('click', () => {
      const t = tasks.find(x => x.id == el.dataset.id);
      if (!t) return;
      t.done = !t.done;
      if (t.done && !tag.system) t.tagId = currentTagId;
      save(); render();
    });
  });

  renderCounts();
}

function countOf(tagId) { return tasks.filter(t => t.tagId === tagId && !t.done).length; }

function renderCounts() {
  tags.forEach(t => {
    const el = rail.querySelector(`[data-count="${t.id}"]`);
    if (!el) return;
    const n = t.system ? tasks.filter(x => x.done).length : countOf(t.id);
    el.textContent = n > 0 ? n : '';
  });
}

function renderSettings() {
  document.getElementById('swTop').classList.toggle('on', !!settings.alwaysOnTop);
  document.getElementById('swStart').classList.toggle('on', !!settings.autoStart);
  document.getElementById('swRemind').classList.toggle('on', settings.remind !== false);
  document.getElementById('swFull').classList.toggle('on', settings.hideOnFullscreen !== false);
  document.getElementById('swOcc').classList.toggle('on', settings.hideOnOcclude !== false);
  document.getElementById('delayRange').value = settings.openDelay;
  document.getElementById('delayVal').textContent = settings.openDelay + 'ms';
  applyScale();
  document.querySelectorAll('.pos-btn').forEach(b => b.classList.toggle('on', b.dataset.pos === settings.pos));

  const box = document.getElementById('tagEditor');
  box.innerHTML = tags.map(t => `
    <div class="tag-row" data-tag="${t.id}">
      <input type="color" class="tag-color" value="${t.color}" data-role="color" ${t.system ? 'disabled' : ''}>
      <input type="text" class="tag-name" value="${escapeAttr(t.name)}" data-role="name" maxlength="8" ${t.system ? 'disabled' : ''}>
      <button class="tag-del" data-role="del" ${t.system || tags.filter(x => !x.system).length <= 1 ? 'disabled' : ''} title="删除">×</button>
    </div>`).join('');

  box.querySelectorAll('.tag-row').forEach(row => {
    const id = row.dataset.tag;
    const tag = tags.find(t => t.id === id);
    row.querySelector('[data-role="name"]').addEventListener('input', e => {
      tag.name = e.target.value || '未命名';
      save(); renderRail(); renderCounts();
      if (currentTagId === id) document.getElementById('panelTitle').textContent = tag.name;
    });
    row.querySelector('[data-role="color"]').addEventListener('input', e => {
      tag.color = e.target.value;
      save(); renderRail(); renderCounts();
    });
    row.querySelector('[data-role="del"]').addEventListener('click', () => {
      if (tag.system || tags.filter(x => !x.system).length <= 1) return;
      const fallback = tags.find(t => t.id !== id && !t.system).id;
      tasks.forEach(t => { if (t.tagId === id) t.tagId = fallback; });
      tags = tags.filter(t => t.id !== id);
      if (currentTagId === id) currentTagId = fallback;
      save(); render();
    });
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

  setTimeout(() => {
    const row = document.querySelector('#tagEditor .tag-row:last-child .tag-name');

/* ========== 悬停意图控制 ========== */
const CLOSE_DELAY = 130;
const GRACE = 10;
let openTimer = null, closeTimer = null, isOpen = false, pinned = false, insideNow = false;
let OPEN_DELAY = 400;

function overDock(x, y) {
  const r = dock.getBoundingClientRect();
  return x >= r.left - GRACE && x <= r.right + GRACE && y >= r.top - GRACE && y <= r.bottom + GRACE;
}
function cancelClose() { if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; } }

function openPanel() {
  clearTimeout(openTimer); openTimer = null;
  cancelClose();
  if (isOpen) return;
  isOpen = true;
  dock.classList.add('is-open');
}
function closePanel() {
  clearTimeout(openTimer); openTimer = null;
  cancelClose();
  if (!isOpen || pinned) return;
  isOpen = false;
  dock.classList.remove('is-open');
  if (screen === 'settings') { screen = 'list'; render(); }
}
function scheduleClose() {
  clearTimeout(openTimer); openTimer = null;
  if (!isOpen || pinned || closeTimer) return;
  closeTimer = setTimeout(() => { closeTimer = null; closePanel(); }, CLOSE_DELAY);
}
function armOpen() {
  cancelClose();
  if (isOpen || openTimer) return;
  OPEN_DELAY = settings.openDelay || 400;
  openTimer = setTimeout(() => { openTimer = null; openPanel(); }, OPEN_DELAY);
}

dock.addEventListener('pointerenter', () => { insideNow = true; armOpen(); });

let rafPending = false;
const lastPt = { x: -1, y: -1 };
document.addEventListener('pointermove', e => {
  lastPt.x = e.clientX; lastPt.y = e.clientY;
  if (drag) return;
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    if (overDock(lastPt.x, lastPt.y)) {
      insideNow = true; cancelClose();
      if (!isOpen) armOpen();
    } else {
      if (insideNow) { insideNow = false; clearTimeout(openTimer); openTimer = null; }
      scheduleClose();
    }
  });
}, { passive: true });

document.addEventListener('mouseleave', () => scheduleClose());
document.documentElement.addEventListener('mouseleave', () => scheduleClose());
window.addEventListener('blur', () => {
  // 桌面版：窗口失焦只是「你点了别的程序」，不等于要收起；由主进程按光标位置决定。
  // 这里再拔钉子会导致「钉住后切个窗口就失效」，也顺便让 Esc 的取消钉住漏同步给主进程。
  if (window.native) return;
  setPinned(false); closePanel();
});
document.addEventListener('pointerdown', e => {
  if (!isOpen || pinned) return;
  if (dock.contains(e.target)) return;
  if (e.target.closest && e.target.closest('.toast-layer')) return;   // 点提醒卡片上的按钮不该关面板
  closePanel();
});
/* 钉住状态的唯一入口：改状态 + 改视觉 + 同步给主进程。
   以前只在点图钉时同步，Esc / 失焦改的 pinned 主进程不知道 ——
   主进程还以为「钉住了」，于是鼠标离开也不收，看起来就是「一直显示」。 */
function setPinned(v) {
  pinned = !!v;
  pinBtn.classList.toggle('on', pinned);
  pinBtn.title = pinned ? '已固定（点击取消）' : '固定展开';
  if (window.native && window.native.setPrefs) window.native.setPrefs({ pinned: pinned });
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  setPinned(false); closePanel();
});

pinBtn.addEventListener('click', e => {
  e.stopPropagation();
  setPinned(!pinned);
  if (pinned) openPanel();
  else if (!dock.matches(':hover')) { clearTimeout(closeTimer); closeTimer = setTimeout(() => { closeTimer = null; closePanel(); }, CLOSE_DELAY); }
});

/* ========== 快速添加 ========== */
function parseNatural(text) {
  let rest = String(text);
  let dateText = '';
  let m;

  m = rest.match(/(今天|今日|明天|明日|明早|明晚|后天)/);
  if (m) { dateText += ' ' + m[1]; rest = rest.replace(m[0], ' '); }

  m = rest.match(/(?:周|星期)[一二三四五六日天]/);
  if (m) { dateText += ' ' + m[0]; rest = rest.replace(m[0], ' '); }

  if (!dateText) {
    m = rest.match(/(\d{1,2})\s*[-月/]\s*(\d{1,2})/);
    if (m) { dateText += ' ' + m[0]; rest = rest.replace(m[0], ' '); }
  }

  m = rest.match(/(凌晨|上午|中午|下午|傍晚|晚上|今晚|早上)?\s*(\d{1,2})\s*[:：点]\s*(\d{0,2})/);
  if (m) { dateText += ' ' + m[0]; rest = rest.replace(m[0], ' '); }

  const title = rest.replace(/[，,。、\s]+/g, ' ').trim() || '未命名事项';
  const r = parseDate(dateText);
  const dueAt = r ? r.dueAt : null;
  const dayOnly = r ? r.dayOnly : true;
  const due = r ? fmtDue(dueAt, dayOnly, /周|星期/.test(dateText)) : (dateText.trim() || '稍后');
  return { title, due, dueAt, dayOnly };
}

const addInput = document.getElementById('addInput');
addInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const val = addInput.value.trim();
  if (!val) return;
  const { title, due, dueAt, dayOnly } = parseNatural(val);
  const tag = tags.find(t => t.id === currentTagId) || tags[0];
  const past = dueAt != null && dayOnly && dueAt < Date.now();   // 「今天」这种只写日期又已过点的，不补提醒
  tasks.unshift({
    id: nextId(), title, due, dueAt, dayOnly,
    tagId: tag.system ? tags[0].id : tag.id,
    pri: 2, done: false,
    reminded: dueAt == null || past
  });
  addInput.value = '';
  save(); render();
  checkDue();
});

/* ========== 提醒 ========== */
/* 让主进程解除「提醒期间保持展开」的锁，网页版里什么也不做 */
function releaseHold() {
  if (window.native && window.native.releaseHold) window.native.releaseHold();
}

function showToast(task) {
  const layer = document.getElementById('toastLayer');
  if (!layer) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.dataset.taskId = task.id;
  el.innerHTML = `
    <div class="toast-head"><span class="pri p1" style="width:6px;height:6px"></span>待办提醒</div>
    <div class="toast-title">${escapeHtml(task.title)}</div>
    <div class="toast-time">${escapeHtml(task.due || '现在')}</div>
    <div class="toast-btns">
      <button class="tbtn" data-act="snooze">10 分钟后</button>
      <button class="tbtn" data-act="later">明天再说</button>
      <button class="tbtn primary" data-act="done">完成</button>
    </div>`;
  layer.appendChild(el);

  const dismiss = () => {
    el.style.transition = 'opacity .2s, transform .2s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(14px)';
    setTimeout(() => el.remove(), 200);
  };

  el.querySelectorAll('.tbtn').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation();
    const act = b.dataset.act;
    const t = tasks.find(x => String(x.id) === String(task.id));
    if (act === 'done' && t) {
      t.done = true; t.reminded = true;
      save(); render();
    } else if (act === 'snooze' && t) {
      t.dueAt = Date.now() + 10 * 60000;
      t.dayOnly = false; t.reminded = false;
      t.due = fmtDue(t.dueAt, false);
      save(); render();
    } else if (act === 'later' && t) {
      const d = startOfDay(new Date(Date.now() + DAY_MS));
      d.setHours(9, 0, 0, 0);
      t.dueAt = d.getTime();
      t.dayOnly = false; t.reminded = false;
      t.due = fmtDue(t.dueAt, false);
      save(); render();
    }
    dismiss();
    releaseHold();                              // 处理完就让便签能自动收起
  }));

  const autoHide = setTimeout(() => {
    if (!el.parentNode) return;
    dismiss();
    releaseHold();                              // 卡片都收走了，就别再占着「保持展开」的 15 秒
  }, 12000);
  el.addEventListener('transitionend', () => clearTimeout(autoHide), { once: true });
}

/* 真正的投递口。打包版里这一句会被替换成「收起时走系统通知」 */
function fireToast(task) { showToast(task); }

/* 每 15 秒扫一遍到点任务 */
function checkDue() {
  if (settings.remind === false) return 0;
  const now = Date.now();
  const due = [];
  let changed = false;

  tasks.forEach(t => {
    if (t.done || t.reminded || !t.dueAt) return;
    if (t.dueAt > now) return;
    if (now - t.dueAt > REMIND_WINDOW) {       // 错过太久的静默处理，别一开机炸一堆
      t.reminded = true; changed = true; return;
    }
    due.push(t);
  });
  if (changed) save();
  if (!due.length) return 0;

  // 一次最多弹 3 张卡。剩下的**不标记 reminded**，下一轮（15 秒后）自然接上，
  // 否则同时到点 4 条时第 4 条会被永久吞掉。
  due.sort((a, b) => a.dueAt - b.dueAt);
  const shown = due.slice(0, 3);
  shown.forEach(t => { t.reminded = true; });
  save();

  shown.forEach(t => fireToast(t));
  if (screen === 'list') render(); else renderRail();
  return shown.length;
}

setInterval(checkDue, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDue(); });

document.getElementById('demoBtn').addEventListener('click', () => fireToast({ id: 0, title: '交周报', due: '明天 15:00' }));
document.getElementById('remindTry').addEventListener('click', () => {
  fireToast({ id: '__demo__', title: '这是一条测试提醒', due: '现在' });
});
document.getElementById('resetBtn').addEventListener('click', () => {
  localStorage.removeItem(STORE_KEY); load(); screen = 'list'; applyPos(); applyScale(); render();
});

/* ========== 启动 ========== */
load();
OPEN_DELAY = settings.openDelay || 400;
applyPos();
applyScale();
render();
setTimeout(checkDue, 1200);                  // 补上程序没开时错过的提醒（等 APP LAYER 接好投递口）
window.__dockTick = checkDue;                // 测试/调试用
window.__dockSeed = (list) => { tasks = list; migrateTasks(); save(); render(); return tasks.length; };
</script>
